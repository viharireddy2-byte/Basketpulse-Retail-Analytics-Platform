name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: LookML static checks
        run: python scripts/lint_lookml.py
      - name: Unit tests (generator, SQL rendering, benchmark helpers)
        run: python -m pytest -q
      - name: Smoke-test the generator end to end
        run: python -m datagen.generate --profile tiny --out /tmp/bp-smoke
