name: Optional BigQuery integration
on:
  workflow_dispatch:
    inputs:
      project:
        description: Isolated billable test project
        required: true
      workload_identity_provider:
        description: Configured GitHub Workload Identity Provider resource
        required: true
      service_account:
        description: Test service account email
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: basketpulse-cloud-integration
  cancel-in-progress: false
jobs:
  warehouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloud-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}
      - run: pip install -r requirements-dev.txt -r requirements-gcp.txt
      - name: Verify transactional replay in disposable dataset
        env:
          BASKETPULSE_TEST_PROJECT: ${{ inputs.project }}
        run: python -m pytest tests/test_operations_cloud.py -q --junitxml=cloud-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bigquery-integration-results
          path: cloud-results.xml
